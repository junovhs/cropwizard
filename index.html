<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>cropcut — frame it once, ship it everywhere</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><b>crop</b><i>cut</i></div>
    <div id="filename" class="filename"></div>
    <div class="spacer"></div>
    <div class="top-actions">
      <button id="add" type="button">Add images</button>
    </div>
  </header>

  <main class="workspace">
    <section id="stage" class="stage" aria-label="Framing area">
      <canvas id="canvas" tabindex="0"
        aria-label="Viewfinder. The crop frame is fixed at the centre. Drag to move the image beneath it, scroll to zoom."></canvas>
      <input id="file" type="file" accept="image/*" multiple hidden>

      <div id="empty" class="empty">
        <div class="empty-inner">
          <h1>Drop your images</h1>
          <p>Frame them once. Ship them at any size.</p>
          <button id="emptyAdd" class="primary" type="button">Choose images</button>
        </div>
      </div>

      <div id="readout" class="readout" hidden>
        <span class="chip">Cutting <strong id="cropSize">—</strong></span>
        <span id="qualityChip" class="chip good">Quality <strong id="quality">—</strong></span>
      </div>

      <div id="hints" class="hints" hidden>
        <span><kbd>drag</kbd> move</span>
        <span><kbd>scroll</kbd> zoom</span>
        <span><kbd>0</kbd> fill</span>
      </div>

      <div class="drop-veil">Drop to add</div>
    </section>

    <aside class="panel" aria-label="Options">
      <section class="block">
        <h2>Output size</h2>
        <div class="size-input">
          <input id="targetW" type="number" min="1" max="16384" inputmode="numeric" aria-label="Output width" value="1080">
          <span aria-hidden="true">×</span>
          <input id="targetH" type="number" min="1" max="16384" inputmode="numeric" aria-label="Output height" value="1080">
        </div>
        <p class="note">The frame always matches this shape.</p>
      </section>
    </aside>
  </main>
</div>

<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
